<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wer ist das Pokémon?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Wer ist das Pokémon?</h1>

  <!-- Hier kommt das Bild vom Pokémon rein (am Anfang schwarz) -->
  <img id="pokemon-bild" class="silhouette" src="" alt="Pokémon">

  <!-- Hier tippt der Spieler seinen Tipp ein -->
  <div>
    <input id="tipp-feld" type="text" placeholder="Name eintippen...">
    <button id="raten-knopf">Raten!</button>
  </div>

  <!-- Hier zeigen wir an, ob es richtig oder falsch war -->
  <p id="ergebnis"></p>

  <!-- Knopf um ein neues Pokémon zu laden -->
  <button id="neu-knopf">Neues Pokémon</button>

  <script src="script.js"></script>
</body>
</html>
